<section id="contact" class="contact">

    <div class="section-title">

        <h2>Get In Touch</h2>

        <p>Let's connect and build something amazing together.</p>

    </div>

    <div class="contact-container">

        <!-- Left Side -->

        <div class="contact-info">

            <div class="info-card">
                <h3>📞 Phone</h3>
                <p>+91 901991 8551</p>
            </div>

            <div class="info-card">
                <h3>📧 Email</h3>
                <p>gouravb252@gmail.com</p>
            </div>

            <div class="info-card">
                <h3>📍 Location</h3>
                <p>Bidar, Karnataka, India</p>
            </div>

            <div class="info-card">
                <h3>💼 LinkedIn</h3>
                <p>https://www.linkedin.com/in/gourav-ukhande-176405407/</p>
            </div>

            <div class="info-card">
                <h3>🐙 GitHub</h3>
                <p>https://github.com/gouravb2528</p>
            </div>

        </div>

        <!-- Right Side -->

        <div class="contact-form">

            <form>

                <input
                        type="text"
                        [(ngModel)]="name"
                        placeholder="Your Name">

                <input
                        type="email"
                        [(ngModel)]="email"
                        placeholder="Your Email">

                <textarea
                        [(ngModel)]="message"
                        placeholder="Write your message..."
                        rows="6"
                ></textarea>

                <button type="submit" (click)="sendEmail()">
                    Send Message
                </button>

            </form>

        </div>

    </div>

</section>
